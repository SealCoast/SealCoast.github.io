<div id="settings-container">
  <button type="button" id="dark-mode" aria-label="切换深浅配色">深色</button>
</div>
<script>
(() => {
  const root = document.documentElement.style;
  const button = document.getElementById('dark-mode');
  let saved;
  try { saved = localStorage.getItem('s'); } catch (_) {}
  let dark = saved ? saved === '1' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  const light = ['#fafafa','#f4f4f4','#212121','#808080','#b0b0b0','#b5c8cf','#618794','#dae4e7','#dae4e7'];
  const night = ['#212121','#292929','#fff','#c0c0c0','#6e6e6e','#4d6b75','#96b1bb','#5d828e','#acc1c9'];
  const names = ['bg-color','code-bg-color','text-color','secondary-color','tertiary-color','link-color','link-hover-color','link-bg-color','selection-color'];
  function apply() {
    names.forEach((name, index) => root.setProperty('--' + name, (dark ? night : light)[index]));
    button.textContent = dark ? '浅色' : '深色';
    button.setAttribute('aria-pressed', String(dark));
  }
  button.onclick = () => {
    dark = !dark;
    try { localStorage.setItem('s', dark ? '1' : '2'); } catch (_) {}
    apply();
  };
  apply();
})();
</script>
